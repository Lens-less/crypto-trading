services:
  operator:
    init: true
    build:
      context: ..
      dockerfile: Dockerfile
    image: crypto-trading:production-candidate
    restart: unless-stopped
    stop_grace_period: 70s
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "3"
        - http://127.0.0.1:8787/api/v1/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CRYPTO_TRADING_WEB_TOKEN: ${CRYPTO_TRADING_WEB_TOKEN:?set CRYPTO_TRADING_WEB_TOKEN}
    command:
      - --history-path
      - /var/lib/crypto-trading/operations.jsonl
      - --journal-id
      - ${CRYPTO_TRADING_JOURNAL_ID:?set CRYPTO_TRADING_JOURNAL_ID}
      - --port
      - "8787"
      - --bearer-token-env
      - CRYPTO_TRADING_WEB_TOKEN
    volumes:
      - ${CRYPTO_TRADING_DATA_DIR:?set CRYPTO_TRADING_DATA_DIR}:/var/lib/crypto-trading
      - ../rust/config:/etc/crypto-trading:ro
