name: Rust quality gates

# A denylist, not an allowlist. An allowlist of individual paths silently
# skipped test fixtures, the Dockerfile, and everything under deploy/, so a
# change to any of them could ship with a green check and no gate having run.
# Only the frozen evidence trees are exempt, because nothing builds from them.
on:
  push:
    paths-ignore:
      - "**/*.md"
      - "design-previews/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "design-previews/**"

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality gates
    uses: ./.github/workflows/frontend.yml

  verify:
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: "1.89.0"
          - os: ubuntu-latest
            toolchain: stable
          - os: windows-latest
            toolchain: "1.89.0"
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "rust -> target"
          key: ${{ matrix.toolchain }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend/dist
      - run: cargo +${{ matrix.toolchain }} check --workspace --all-targets --all-features --locked
      - run: cargo +${{ matrix.toolchain }} test --workspace --all-targets --all-features --locked

  quality:
    name: Formatting, linting, and release build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: frontend
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "rust -> target"
          key: stable-quality
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend/dist
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Documentation builds without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --no-deps --workspace --all-features --locked
      - run: cargo +stable build --release --workspace --all-features --locked
      - name: Release binaries retain diagnostic line tables
        shell: bash
        run: |
          for binary in target/release/crypto-trading target/release/crypto-trading-web; do
            test -x "$binary"
            readelf --sections --wide "$binary" | grep -Eq '\.debug_(line|line_str)'
          done

  clean-build:
    name: Isolated MSRV quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: frontend
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner context is not available in job-level env, so the isolated
      # target directory has to be exported from a step instead.
      - name: Point CARGO_TARGET_DIR at an isolated directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/crypto-trading-clean-target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy
      - name: Assert the isolated target directory starts absent
        shell: bash
        run: test ! -e "$CARGO_TARGET_DIR"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend/dist
      - run: cargo +1.89.0 fmt --all -- --check
      - run: cargo +1.89.0 check --workspace --all-targets --all-features --locked
      - run: cargo +1.89.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +1.89.0 test --workspace --all-targets --all-features --locked
      - run: cargo +1.89.0 test --doc --workspace --all-features --locked
      - run: cargo +1.89.0 build --release --workspace --all-features --locked
  audit:
    name: RustSec advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Prove the temporary rkyv exception is unreachable
        working-directory: rust
        shell: bash
        run: |
          exception_expires="2026-11-04"
          if [[ "$(date -u +%F)" > "${exception_expires}" ]]; then
            echo "RUSTSEC-2026-0235 exception expired on ${exception_expires}; remove or re-review it."
            exit 1
          fi

          dependency_tree="$(cargo +stable tree --workspace --target all --all-features --locked --prefix none)"
          active_rkyv="$(grep -E '^rkyv v' <<< "${dependency_tree}" || true)"
          if [[ -n "${active_rkyv}" ]]; then
            echo "rkyv entered the active workspace graph; RUSTSEC-2026-0235 may not be ignored."
            echo "${active_rkyv}"
            exit 1
          fi
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rust
          # Keep in sync with rust/.cargo/audit.toml; the reachability and
          # expiry guard above must pass before this exception is accepted.
          ignore: RUSTSEC-2026-0235

  supply-chain:
    name: License, ban, and source policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      # RustSec covers advisories. This covers what an advisory feed does not:
      # license compatibility, duplicate versions, and crate provenance.
      - run: cargo install cargo-deny --locked --version ^0.16
      - run: cargo deny --manifest-path rust/Cargo.toml check bans licenses sources

  deployment:
    name: Container image and operator scripts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The deployed artifact is the image, so a Dockerfile that no longer
      # builds must fail here rather than during a release.
      - run: docker build --tag crypto-trading:ci .
      - name: Deployment manifest stays valid
        env:
          CRYPTO_TRADING_DATA_DIR: /tmp/ci-journal
          CRYPTO_TRADING_JOURNAL_ID: 00000000-0000-4000-8000-000000000000
          CRYPTO_TRADING_WEB_TOKEN: ci-validation-token-not-a-secret-000000
        run: docker compose -f deploy/compose.yaml config --quiet
      - name: Writable paper owners drain durably on SIGTERM
        shell: bash
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/crypto-trading-data"
          mkdir -p "$data_dir"
          chmod 0777 "$data_dir"
          : > "$data_dir/operations.jsonl"
          chmod 0666 "$data_dir/operations.jsonl"
          token="ci-sigterm-token-not-a-secret-000000"
          docker run \
            --detach \
            --init \
            --name crypto-trading-sigterm-smoke \
            --read-only \
            --tmpfs /tmp:size=16m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --env "CRYPTO_TRADING_WEB_TOKEN=$token" \
            --volume "$data_dir:/var/lib/crypto-trading" \
            --volume "$GITHUB_WORKSPACE/rust/config:/etc/crypto-trading:ro" \
            --volume "$GITHUB_WORKSPACE/rust/fixtures:/fixtures:ro" \
            crypto-trading:ci \
            --history-path /var/lib/crypto-trading/operations.jsonl \
            --journal-id 44444444-4444-4444-8444-444444444444 \
            --port 8787 \
            --bearer-token-env CRYPTO_TRADING_WEB_TOKEN \
            --enable-paper-writes \
            --paper-account-risk-config /etc/crypto-trading/paper/account-risk.example.yaml \
            --paper-grid-task-id paper-grid-owner \
            --paper-grid-strategy-id grid.strategy \
            --paper-grid-strategy-revision grid.v1 \
            --paper-grid-config /etc/crypto-trading/grid/paper-once-btc.yaml \
            --paper-grid-replay /fixtures/m4-grid-paper-replay.jsonl \
            --paper-grid-shutdown-grace-ms 20000 \
            --paper-arbitrage-task-id paper-arbitrage-owner \
            --paper-arbitrage-strategy-id arb.strategy \
            --paper-arbitrage-strategy-revision arb.v1 \
            --paper-arbitrage-config /etc/crypto-trading/arbitrage/paper-once-eth.yaml \
            --paper-arbitrage-monitor-config /etc/crypto-trading/arbitrage/paper-monitor-eth.yaml \
            --paper-arbitrage-replay /fixtures/m4-arbitrage-paper-replay.jsonl \
            --paper-arbitrage-shutdown-grace-ms 20000
          for attempt in $(seq 1 30); do
            if docker exec crypto-trading-sigterm-smoke \
              curl --fail --silent --show-error http://127.0.0.1:8787/api/v1/health; then
              break
            fi
            sleep 1
            if [ "$attempt" -eq 30 ]; then
              docker logs crypto-trading-sigterm-smoke
              exit 1
            fi
          done

          grid_payload="$(jq -nc '{schema_version:1,command_id:"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa",idempotency_key:"ci-grid-start",target_task_id:"paper-grid-owner",permission:{principal_id:"local-paper-operator",role:"paper_operator"},risk_confirmation:"paper_only",command:{kind:"start_paper_grid",strategy_id:"grid.strategy",strategy_revision:"grid.v1"}}')"
          grid_response="$(docker exec crypto-trading-sigterm-smoke curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $token" \
            --header "Content-Type: application/json" \
            --data "$grid_payload" \
            http://127.0.0.1:8787/api/v1/submit)"
          jq -e '.status == "applied"' <<<"$grid_response" >/dev/null

          arbitrage_payload="$(jq -nc '{schema_version:1,command_id:"bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb",idempotency_key:"ci-arbitrage-start",target_task_id:"paper-arbitrage-owner",permission:{principal_id:"local-paper-operator",role:"paper_operator"},risk_confirmation:"paper_only",command:{kind:"start_paper_arbitrage",strategy_id:"arb.strategy",strategy_revision:"arb.v1"}}')"
          arbitrage_response="$(docker exec crypto-trading-sigterm-smoke curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $token" \
            --header "Content-Type: application/json" \
            --data "$arbitrage_payload" \
            http://127.0.0.1:8787/api/v1/submit)"
          jq -e '.status == "applied"' <<<"$arbitrage_response" >/dev/null

          for attempt in $(seq 1 60); do
            tasks="$(docker exec crypto-trading-sigterm-smoke curl --fail --silent --show-error \
              --header "Authorization: Bearer $token" \
              http://127.0.0.1:8787/api/v1/tasks)"
            if jq -e '
              [.tasks[] | select(
                (.task_id == "paper-grid-owner" or .task_id == "paper-arbitrage-owner")
                and .phase == "running"
              )] | length == 2
            ' <<<"$tasks" >/dev/null; then
              break
            fi
            sleep 1
            if [ "$attempt" -eq 60 ]; then
              docker logs crypto-trading-sigterm-smoke
              echo "paper owners never both reached running" >&2
              exit 1
            fi
          done

          docker exec \
            --env "CI_WEB_TOKEN=$token" \
            crypto-trading-sigterm-smoke \
            sh -c 'exec curl --silent --no-buffer --header "Authorization: Bearer $CI_WEB_TOKEN" http://127.0.0.1:8787/api/v1/events >/tmp/ci-events.out' &
          sse_pid=$!
          sleep 1
          if ! kill -0 "$sse_pid" 2>/dev/null || ! docker exec crypto-trading-sigterm-smoke test -s /tmp/ci-events.out; then
            wait "$sse_pid" || true
            docker logs crypto-trading-sigterm-smoke || true
            echo "SSE smoke client did not establish a live stream" >&2
            exit 1
          fi

          shutdown_started="$(date +%s)"
          docker stop --time 65 crypto-trading-sigterm-smoke
          shutdown_elapsed="$(( $(date +%s) - shutdown_started ))"
          if [ "$shutdown_elapsed" -ge 70 ]; then
            echo "graceful shutdown exceeded the 70-second compose budget" >&2
            exit 1
          fi
          exit_code="$(docker inspect -f '{{.State.ExitCode}}' crypto-trading-sigterm-smoke)"
          if [ "$exit_code" -ne 0 ]; then
            docker logs crypto-trading-sigterm-smoke || true
            echo "expected graceful SIGTERM exit code 0, got $exit_code" >&2
            exit 1
          fi

          for attempt in $(seq 1 20); do
            if ! kill -0 "$sse_pid" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          if kill -0 "$sse_pid" 2>/dev/null; then
            kill "$sse_pid" 2>/dev/null || true
            echo "SSE client remained blocked after application shutdown" >&2
            exit 1
          fi
          wait "$sse_pid" || true

          jq -s -e '
            [.[] | select(.decision == "task_stopped") | .details.task_id] | sort
              == ["paper-arbitrage-owner", "paper-grid-owner"]
          ' "$data_dir/operations.jsonl" >/dev/null
          docker logs crypto-trading-sigterm-smoke >"$RUNNER_TEMP/crypto-trading-sigterm.log" 2>&1
          grep -Fq 'web_shutdown_completed' "$RUNNER_TEMP/crypto-trading-sigterm.log"
          if grep -Fq "$token" "$RUNNER_TEMP/crypto-trading-sigterm.log"; then
            echo "bearer token leaked into container logs" >&2
            exit 1
          fi
      - name: Remove SIGTERM smoke container
        if: always()
        shell: bash
        run: docker rm -f crypto-trading-sigterm-smoke >/dev/null 2>&1 || true
      - run: shellcheck deploy/*.sh
