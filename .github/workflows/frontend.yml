name: Frontend quality gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  bundle:
    name: Build frontend bundle once
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # corepack activates the pnpm version pinned by the packageManager
      # field, so CI and local builds share one toolchain definition.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  frontend:
    name: ${{ matrix.os }} / typecheck, lint, test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # corepack activates the pnpm version pinned by the packageManager
      # field, so CI and local builds share one toolchain definition.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test -- --run

  # Real-browser contract: Playwright drives the shipped artifact - the
  # crypto-trading-web binary with frontend/dist embedded - not a dev server.
  # Runs on ubuntu only; the same suite runs locally on Windows via `pnpm e2e`.
  e2e:
    name: Browser contract against the embedded binary
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: corepack enable
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: "rust -> target"
          key: e2e
      - name: Build the web control-plane binary
        working-directory: rust
        run: cargo build --locked -p crypto-trading-web-app --bin crypto-trading-web
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the Playwright browser contract
        working-directory: frontend
        run: pnpm e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          if-no-files-found: ignore

  supply-chain-frontend:
    name: Frontend registry, advisory, and license policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: corepack enable
      - name: Lockfile resolves only from registry.npmjs.org
        run: node scripts/check-lockfile-registry.mjs
      - run: pnpm install --frozen-lockfile
      # Advisories against shipped (production) dependencies fail the build.
      # No continue-on-error: a registry outage failing this job is preferable
      # to a high-severity advisory shipping with a green check.
      - name: Production dependency advisory audit
        run: pnpm audit --prod --audit-level=high
      - name: License allowlist over the full dependency tree
        run: pnpm licenses list --json | node scripts/check-licenses.mjs
