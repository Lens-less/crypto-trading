version: 2

updates:
  # Every cargo invocation in CI uses --locked, so a dependency bump is a real
  # change to the built artifact and must pass the full matrix like any other.
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
