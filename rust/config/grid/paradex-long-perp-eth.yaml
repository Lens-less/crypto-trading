# ==============================================================================
# Paradex ETH 永续合约做多网格配置
# ==============================================================================
#
# 历史目标：Paradex 稳健型做多网格；当前文件仅可作 legacy 配置检查
# ✨ 特性：
#    - Maker 0 手续费，鼓励使用限价单
#    - 0.05% Taker 费率（仅止损/急速撤退时触发）
#    - WebSocket 私有频道实时跟单，避免 REST 轮询延迟
#
# 当前 Rust paper one-shot：
#   cargo run -- grid config/grid/paradex-long-perp-eth.yaml --once --price <显式价格>
#
# 风险提示：
#   - 当前 paper one-shot 不需要凭证；Rust 不会自动加载 .env
#   - live 私有适配器尚未开放；后续所需凭证必须从进程环境变量读取
#   - Paradex 下单默认 GTC，可通过 grid_system.order_instruction 修改为 IOC/FOK/POST_ONLY
#
# ==============================================================================

grid_system:
  # ============================================================================
  # 基础配置
  # ============================================================================
  exchange: "paradex"
  symbol: "ETH/USDC:PERP"          # 标准化符号 -> 适配器自动映射为 ETH-USD-PERP
  maker_fee_rate: 0.0              # Paradex Maker = 0（保持挂单即可免手续费）
  taker_fee_rate: 0.0005           # Paradex Taker ≈ 0.05%
  order_instruction: "GTC"         # Paradex 指定 instruction，支持 GTC/IOC/FOK/POST_ONLY
  leverage: 1                      # Paradex 默认全仓，杠杆由账号层控制

  # ----------------------------------------------------------------------------
  # 网格类型（默认跟随价格做多，亦可切换固定范围/马丁）
  # ----------------------------------------------------------------------------
  grid_type: "follow_long"
  # grid_type: "long"
  # grid_type: "martingale_long"

  # ============================================================================
  # 价格移动网格参数
  # ============================================================================
  follow_grid_count: 80            # 跟随区间 80 格
  follow_timeout: 1200             # 价格脱离 20 分钟仍未回归则重置
  follow_distance: 2               # 允许偏移 2 格
  price_offset_grids: 4            # 网格初始化时，上边界 = 当前价 + 4 格

  # ============================================================================
  # 固定范围 / 马丁参数（默认注释，可按需开启）
  # ============================================================================
  # lower_price: 2800.0
  # upper_price: 3400.0
  # martingale_increment: 0.0005

  # ============================================================================
  # 通用网格参数
  # ============================================================================
  grid_interval: 5.0               # 每格 $5
  order_amount: 0.02               # 每格 0.02 ETH
  quantity_precision: 3            # Paradex ETH 支持 0.001 精度
  max_active_orders: 60            # 防止订单过多（网格重置后自动刷新）

  # ============================================================================
  # 剥头皮 / 保护 / 止盈 / 止损
  # ============================================================================
  scalping_enabled: true
  scalping_trigger_percent: 35     # 价格从顶端回撤 35% 触发剥头皮
  scalping_take_profit_grids: 2

  capital_protection_enabled: true
  capital_protection_trigger_percent: 30

  take_profit_enabled: true
  take_profit_percentage: 0.003    # 0.3% 账户收益即止盈

  price_lock_enabled: true
  price_lock_threshold: 4200.0     # ETH ≥ $4,200 时锁定网格，等待回调

  stop_loss_protection_enabled: true
  stop_loss_trigger_percent: 90.0  # 价格击穿下边界 90% 触发紧急撤退
  stop_loss_escape_timeout: 600
  stop_loss_apr_threshold: 40.0    # 近10分钟 APR < 40% 视为弱势 → 停止策略

  # ============================================================================
  # 订单健康检查 & 持仓回查
  # ============================================================================
  order_health_check_interval: 600       # 每 10 分钟同步一次 WebSocket / REST 订单
  rest_position_query_interval: 2        # 每 2 秒查询一次仓位，校验 WS 推送

  # ============================================================================
  # 风险提示
  # ============================================================================
  # 1. 当前 Rust 只支持 placement-only paper one-shot，不读取 Paradex 凭证
  # 2. 本文件包含未接入的历史保护字段，因此必须由 config-check 标为 legacy-parseable
  # 3. 私有 live adapter、签名、testnet 下单和对账未验收前，不得把此文件用于真实订单

