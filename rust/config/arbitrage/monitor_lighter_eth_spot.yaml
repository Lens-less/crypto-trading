# ============================================================================
# Lighter ETH 现货合约套利监控配置（ETH/USDC ↔ ETH 多腿套利专用）
# ============================================================================
# 
# 用途: Lighter 交易所内 ETH 现货 ↔ ETH 合约同所多腿套利
# 当前状态: 显式列出 Rust monitor universe；连续 runtime 仍保持 fail-closed
# 检查: cargo run -- config-check config/arbitrage/monitor_lighter_eth_spot.yaml
# ============================================================================

# Rust 可解析的交易所 allowlist
exchanges:
  - lighter

# Rust 要求显式非空的交易对 allowlist；不会从其他文件自动补全
symbols:
  - ETH-USDC-PERP
  - ETH-USDC-SPOT

# 以下历史 UI 字段未接入 Rust runtime
health_check:
  data_timeout: 30
  max_pair_skew_ms: 1000

performance:
  ui_refresh_interval_ms: 1000  # UI刷新间隔（毫秒）

# 历史 Debug CLI 字段同样未接入
debug_cli:
  enabled: false                # 是否启用CLI调试模式（false=使用富UI）
  interval_seconds: 1.0         # CLI打印间隔（秒）
