# ====================================
# 虚拟网格扫描器配置文件
# ====================================
# 功能：离线回放历史价格，评估虚拟网格 APR 并输出 S/A/B/C/D 评级排名。
# 该扫描器只读：没有下单权限，也不连接实时行情源。

scanner:
  # 交易所标识（回放数据源必须使用同一标识）
  exchange: "binance"

  # 扫描与评级参数
  scan:
    apr_window_seconds: 360      # APR 滚动窗口（秒）
    min_complete_cycles: 0       # 非 benchmark 符号进入排名所需的最小完整循环数
    row_limit: 50                # 单次扫描持久化的最大排名行数

  # 被扫描的符号列表（有界，至多 128 个精确市场身份）
  symbols:
    - symbol: "BTC/USDT"
      market_type: "spot"
      enabled: true
      benchmark: true            # benchmark 符号始终保留在排名中
      grid:
        width_percent: "10"      # 网格总宽度（上下各 5%）
        interval_percent: "1"    # 相邻网格间距
      volume_24h_usdc: "1000000" # 24 小时成交额（用于评级加减分）
      price_change_24h_percent: "2.5"

    - symbol: "ETH/USDT"
      market_type: "spot"
      enabled: false             # 暂不参与扫描
      grid:
        width_percent: "10"
        interval_percent: "1"
      volume_24h_usdc: "500000"
