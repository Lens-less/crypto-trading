[package]
name = "crypto-trading-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP API and embedded no-build operator control plane for the trading runtime."
# The workspace ships as an application, not as crates.io libraries.
# Publishing is refused explicitly so it cannot happen by accident.
publish = false

[dependencies]
axum.workspace = true
crypto-trading-control-plane = { path = "../control-plane" }
futures-util.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
crypto-trading-runtime = { path = "../runtime" }
serde_json.workspace = true
tower.workspace = true
uuid.workspace = true

[lints]
workspace = true
