<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="本地只读的加密交易控制面，展示总览、虚拟网格排行、价格预警、执行账本与集成能力。"
    />
    <title>加密交易控制面</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body>
    <noscript>
      <p>这个只读控制面需要 JavaScript 才能呈现总览（Overview）、扫描排行（Scanner）、预警（Alerts）、执行（Executions）与集成（Integrations）。</p>
    </noscript>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div class="app-shell">
      <aside class="risk-spine" id="risk-spine" aria-label="风险脊柱"></aside>
      <div class="workspace">
        <header class="workspace-header" id="workspace-header"></header>
        <main id="main-content" class="workspace-main" tabindex="-1">
          <div id="main-view">
            <section class="initial-loading" role="status" aria-live="polite">
              <h2>正在加载只读运行事实</h2>
              <div class="skeleton" aria-hidden="true">
                <div class="skeleton-bar short"></div>
                <div class="skeleton-bar long"></div>
                <div class="skeleton-bar medium"></div>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>
    <aside
      id="detail-drawer-host"
      class="detail-drawer-host"
      aria-label="执行详情"
    ></aside>
    <div id="app-status" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
