[package]
name = "crypto-trading-web-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Binary that serves the read-only operator control plane over loopback."
# The workspace ships as an application, not as crates.io libraries.
# Publishing is refused explicitly so it cannot happen by accident.
publish = false

[lib]
name = "crypto_trading_web_app"
path = "src/lib.rs"

[[bin]]
name = "crypto-trading-web"
path = "src/main.rs"
# The binary's documentation output path collides with the `crypto-trading-web`
# library's. The binary is an entry point with no API to document, so only the
# library is documented.
doc = false

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
crypto-trading-apps = { path = "../apps" }
crypto-trading-control-plane = { path = "../control-plane" }
crypto-trading-runtime = { path = "../runtime" }
crypto-trading-web = { path = "../web" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tower.workspace = true

[lints]
workspace = true
