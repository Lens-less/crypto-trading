[package]
name = "crypto-trading-apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line entry point for configuration checking, paper execution, and Binance testnet operations."
# The workspace ships as an application, not as crates.io libraries.
# Publishing is refused explicitly so it cannot happen by accident.
publish = false

[lib]
name = "crypto_trading_cli"
path = "src/lib.rs"

[[bin]]
name = "crypto-trading"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
crypto-trading-config = { path = "../config" }
crypto-trading-control-plane = { path = "../control-plane" }
crypto-trading-domain = { path = "../domain" }
crypto-trading-exchange = { path = "../exchange" }
crypto-trading-runtime = { path = "../runtime" }
crypto-trading-strategy = { path = "../strategy" }
rust_decimal.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
clap.workspace = true

[lints]
workspace = true
