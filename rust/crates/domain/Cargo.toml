[package]
name = "crypto-trading-domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Validated trading domain types: decimal price and quantity newtypes, symbols, market snapshots, and order intents."
# The workspace ships as an application, not as crates.io libraries.
# Publishing is refused explicitly so it cannot happen by accident.
publish = false

[dependencies]
chrono.workspace = true
rust_decimal = { workspace = true, features = ["serde-with-arbitrary-precision"] }
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
serde_yaml.workspace = true

[lints]
workspace = true
